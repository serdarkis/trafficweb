<!DOCTYPE html>
<html>
<head>
    <title>Augsburg Trafik Haritası</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            width: calc(100% - 300px); /* Panel genişliği kadar daralt */
            height: 80vh;
            flex-grow: 1; /* Harita alanını genişlet */
        }
        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            min-width: 150px;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        .loading {
            display: none;
            margin-left: 10px;
            color: #666;
        }
        .info-box {
            padding: 10px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        /* Yeni Stil: Sağ Panel */
        #historicalDataPanel {
            width: 300px; /* Panel genişliği */
            height: 80vh;
            background: #f8f9fa;
            padding: 20px;
            overflow-y: auto; /* İçerik taşarsa kaydırma çubuğu */
            border-left: 1px solid #dee2e6;
            box-sizing: border-box; /* Padding genişliğe dahil */
        }

        #historicalDataPanel h3 {
            margin-top: 0;
        }

        #historicalDataContent p {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="info-box">
            <label for="dateSelect">Gün Seçin:</label>
            <select id="dateSelect">
                <option value="">Yükleniyor...</option>
            </select>
        </div>
        <div class="info-box">
            <label for="timeSelect">Zaman Aralığı Seçin:</label>
            <select id="timeSelect">
                <option value="">Yükleniyor...</option>
            </select>
        </div>
        <button onclick="updateMap()">Haritayı Güncelle</button>
        <span id="loading" class="loading">Yükleniyor...</span>
    </div>
    
    <!-- Yeni HTML Yapısı: Container ve Paneller -->
    <div style="display: flex;">
        <div id="map"></div> <!-- Harita div'i -->
        <div id="historicalDataPanel"> <!-- Yeni Sağ Panel -->
            <h3>Dedektör Gerçek Verileri (Seçili Zaman Aralığı)</h3>
            <div id="historicalDataContent">
                <p>Bir dedektöre tıklayın...</p>
            </div>
        </div>
    </div>
    <!-- HTML Yapısı Sonu -->

    <script>
        let map;
        let mainLayer = L.layerGroup(); // Tek katman
        let currentData = null;
        let timeDisplayMap = {};
        let currentTrafficData = null;
        
        function initMap() {
            map = L.map('map').setView([48.3705, 10.8978], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            mainLayer.addTo(map);
            loadRoadNetwork();
            loadIntervalOptions();
        }
        
        function loadRoadNetwork() {
            fetch('/get_road_network')
                .then(response => {
                    if (!response.ok) throw new Error('Yol ağı yüklenemedi');
                    return response.json();
                })
                .then(data => {
                    currentData = data;
                    mainLayer.clearLayers();

                    // Yolları ekle
                    data.roads.forEach(road => {
                        const polyline = L.polyline(road.coords, {
                            color: 'gray',
                            weight: 2
                        }).bindPopup(`Yol: ${road.id}<br>Veri yükleniyor...`);
                        polyline._roadId = road.id;
                        polyline.addTo(mainLayer);
                    });

                    // Dedektörleri ekle (detid kontrolü yapın)
                    if (data.detectors && data.detectors.length > 0) {
                        data.detectors.forEach(detector => {
                            if (detector.detid) {
                                const marker = L.circleMarker(detector.coords, {
                                    radius: 5,
                                    fillColor: 'blue', // Başlangıçta mavi
                                    weight: 1,
                                    fillOpacity: 1
                                });
                                marker._detId = detector.detid;
                                marker.addTo(mainLayer);

                                // --- Güncellenmiş: Dedektörlere tıklama eventi ekle (Panel için - Mevcut Veriyi Kullan) ---
                                marker.on('click', function(e) {
                                    const detId = marker._detId;
                                    const historicalDataContentDiv = document.getElementById('historicalDataContent');
                                    const selectedWeekday = document.getElementById('dateSelect').value;
                                    const selectedTime = document.getElementById('timeSelect').value;
                                    historicalDataContentDiv.innerHTML = `<p>Dedektör ${detId} verisi alınıyor...</p>`; // Mesajı güncelle

                                    // currentTrafficData içindeki veriyi kullan
                                    if (currentTrafficData && currentTrafficData.detectors) {
                                        const detData = currentTrafficData.detectors.find(d => d.detid === detId); // Doğrudan detId ile bul
                                        
                                        let content = `<b>Dedektör ${detId} Gerçek Veriler (${selectedWeekday}, ${selectedTime}):</b><br>`;
                                        
                                        if (detData) {
                                            content += `Akış: ${detData.flow?.toFixed(1) || 'N/A'}<br>`;
                                            content += `Doluluk: ${detData.occ?.toFixed(1) || 'N/A'}`;
                                            // Sadece bu dedektörün o zaman aralığındaki verisi gösterilecek, başka dedektör verisi katmayacağız.
                                            // Orjinal ham veriyi modelden çekmeye gerek yok, çünkü prepare_road_data_from_map zaten onu yükleyip buraya gönderiyor.
                                        } else {
                                             content += "Bu zaman aralığı için veri bulunamadı.";
                                        }
                                        historicalDataContentDiv.innerHTML = content; // Panele yaz

                                    } else {
                                        historicalDataContentDiv.innerHTML = `<p style="color: red;">Harita verisi henüz yüklenmedi veya eksik. Lütfen önce haritayı güncelleyin.</p>`;
                                    }
                                });
                                // --- Tıklama eventi sonu ---

                            }
                        });
                    } else {
                        console.error('Dedektör verileri boş veya eksik:', data.detectors);
                    }
                })
                .catch(console.error);
        }
        
        function loadIntervalOptions() {
            fetch('/get_date_time_options')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Sunucu hatası: ${response.status} - Lütfen veri dosyalarının oluşturulduğundan emin olun.`);
                    }
                    return response.json();
                })
                .then(data => {
                    const dateSelect = document.getElementById('dateSelect');
                    const timeSelect = document.getElementById('timeSelect');
                    
                    // Gün seçeneklerini doldur (belirtilen sırayla)
                    dateSelect.innerHTML = '';
                    const weekdays = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
                    weekdays.forEach(weekday => {
                        const option = document.createElement('option');
                        option.value = weekday;
                        option.textContent = weekday;
                        dateSelect.appendChild(option);
                    });
                    
                    // Zaman seçeneklerini doldur
                    timeSelect.innerHTML = '';
                    data.intervals.forEach((interval, index) => {
                        const option = document.createElement('option');
                        option.value = data.time_display[index]; // Zaman görüntüsünü kullan
                        option.textContent = data.time_display[index];
                        timeSelect.appendChild(option);
                    });
                    
                    // Dropdown'ları aktif et
                    dateSelect.disabled = false;
                    timeSelect.disabled = false;
                    
                    // Zaman görüntüleme eşlemesini oluştur
                    timeDisplayMap = {};
                    data.intervals.forEach((interval, index) => {
                        timeDisplayMap[interval] = data.time_display[index];
                    });
                    
                    // Başlangıçta Pazartesi ve 00:00'ı seçili yap
                    dateSelect.value = "Pazartesi";
                    timeSelect.value = "00:00";
                    
                    // İlk seçenekleri yükle
                    updateMap();
                })
                .catch(error => {
                    console.error('Seçenekler yüklenirken hata:', error);
                    document.getElementById('loading').textContent = error.message;
                    document.getElementById('loading').style.display = 'inline';
                });
        }
        
        function updateMap() {
            const weekday = document.getElementById('dateSelect').value;
            const timeDisplay = document.getElementById('timeSelect').value;
            
            if (!weekday || !timeDisplay) return;
            
            document.getElementById('loading').style.display = 'inline';
            
            fetch(`/get_predicted_traffic?weekday=${weekday}&time=${timeDisplay}`)
                .then(response => {
                    if (!response.ok) throw new Error('Trafik verisi alınamadı');
                    return response.json();
                })
                .then(trafficData => {
                    console.log("Gelen veri:", trafficData);
                    currentTrafficData = trafficData;

                    // Dedektör verilerini güncelle
                    if (trafficData.detectors && trafficData.detectors.length > 0) {
                        trafficData.detectors.forEach(det => {
                            mainLayer.eachLayer(layer => {
                                if (layer instanceof L.CircleMarker && layer._detId === det.detid) {
                                    const flow = isNaN(det.flow) ? 'N/A' : det.flow?.toFixed(1);
                                    const occ = isNaN(det.occ) ? 'N/A' : det.occ?.toFixed(1);
                                    layer.setStyle({
                                        fillColor: det.flow ? 'red' : 'blue'
                                    });
                                    layer.bindPopup(`
                                        Dedektör: ${det.detid}<br>
                                        Akış: ${flow}<br>
                                        Doluluk: ${occ}
                                    `);
                                }
                            });
                        });
                    }

                    // Yol verilerini güncelle
                    if (trafficData.roads && trafficData.roads.length > 0) {
                        trafficData.roads.forEach(road => {
                            mainLayer.eachLayer(layer => {
                                if (layer instanceof L.Polyline && layer._roadId === road.id) {
                                    const flow = isNaN(road.flow) ? 'N/A' : road.flow?.toFixed(1);
                                    const occ = isNaN(road.occ) ? 'N/A' : road.occ?.toFixed(1);
                                    layer.setStyle({
                                        color: getRoadColor(road.flow),
                                        weight: 3
                                    });
                                    layer.bindPopup(`
                                        Yol: ${road.id}<br>
                                        Akış: ${flow}<br>
                                        Doluluk: ${occ}
                                    `);
                                }
                            });
                        });
                    }
                })
                .catch(error => {
                    console.error("Hata:", error);
                    document.getElementById('loading').textContent = error.message;
                })
                .finally(() => {
                    document.getElementById('loading').style.display = 'none';
                });
        }
        
        function getRoadColor(flow) {
            if (!flow || isNaN(flow)) return 'gray'; // Veri yoksa veya NaN ise gri
            if (flow < 50) return '#4CAF50'; // Çok hafif (yeşil)
            if (flow < 100) return '#8BC34A'; // Hafif (açık yeşil)
            if (flow < 200) return '#FFEB3B'; // Orta (sarı)
            if (flow < 300) return '#FFC107'; // Yoğun (amber)
            if (flow < 500) return '#FF9800'; // Çok yoğun (turuncu)
            if (flow < 800) return '#F44336'; // Aşırı yoğun (kırmızı)
            return '#9C27B0'; // Kritik (mor)
        }
        
        // Örnek: 300 saniyeyi "00:05" formatına çevirme (client-side conversion - not used now as server sends time_display)
        // function formatInterval(seconds) {
        //     const hours = Math.floor(seconds / 3600);
        //     const mins = Math.floor((seconds % 3600) / 60);
        //     return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        // }
        
        // Sayfa yüklendiğinde haritayı başlat
        window.onload = initMap;
    </script>
</body>
</html>
