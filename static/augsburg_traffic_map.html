<!DOCTYPE html>
<html>
<head>
    <title>Augsburg Trafik Haritası</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            height: 80vh;
            width: 100%;
        }
        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ced4da;
            min-width: 150px;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        .loading {
            display: none;
            margin-left: 10px;
            color: #666;
        }
        .info-box {
            padding: 10px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="info-box">
            <label for="dateSelect">Gün Seçin:</label>
            <select id="dateSelect">
                <option value="">Yükleniyor...</option>
            </select>
        </div>
        <div class="info-box">
            <label for="timeSelect">Zaman Aralığı Seçin:</label>
            <select id="timeSelect">
                <option value="">Yükleniyor...</option>
            </select>
        </div>
        <button onclick="updateMap()">Haritayı Güncelle</button>
        <span id="loading" class="loading">Yükleniyor...</span>
    </div>
    <div id="map"></div>

    <script>
        let map;
        let mainLayer = L.layerGroup(); // Tek katman
        let currentData = null;
        let timeDisplayMap = {};
        
        function initMap() {
            map = L.map('map').setView([48.3705, 10.8978], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            mainLayer.addTo(map);
            loadRoadNetwork();
            loadIntervalOptions();
        }
        
        function loadRoadNetwork() {
            fetch('/get_road_network')
                .then(response => {
                    if (!response.ok) throw new Error('Yol ağı yüklenemedi');
                    return response.json();
                })
                .then(data => {
                    currentData = data;
                    mainLayer.clearLayers();

                    // Yolları ekle
                    data.roads.forEach(road => {
                        const polyline = L.polyline(road.coords, {
                            color: 'gray',
                            weight: 2
                        }).bindPopup(`Yol: ${road.id}<br>Veri yükleniyor...`);
                        polyline._roadId = road.id;
                        polyline.addTo(mainLayer);
                    });

                    // Dedektörleri ekle (detid kontrolü yapın)
                    if (data.detectors && data.detectors.length > 0) {
                        data.detectors.forEach(detector => {
                            if (detector.detid) {
                                const marker = L.circleMarker(detector.coords, {
                                    radius: 5,
                                    fillColor: 'blue',
                                    weight: 1,
                                    fillOpacity: 1
                                }).bindPopup(`Dedektör: ${detector.detid}`);
                                marker._detId = detector.detid;
                                marker.addTo(mainLayer);
                            }
                        });
                    } else {
                        console.error('Dedektör verileri boş veya eksik:', data.detectors);
                    }
                })
                .catch(console.error);
        }
        
        function loadIntervalOptions() {
            fetch('/get_date_time_options')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Sunucu hatası: ${response.status} - Lütfen veri dosyalarının oluşturulduğundan emin olun.`);
                    }
                    return response.json();
                })
                .then(data => {
                    const dateSelect = document.getElementById('dateSelect');
                    const timeSelect = document.getElementById('timeSelect');
                    
                    // Gün seçeneklerini doldur
                    dateSelect.innerHTML = '';
                    data.weekdays.forEach(weekday => {
                        const option = document.createElement('option');
                        option.value = weekday;
                        option.textContent = weekday;
                        dateSelect.appendChild(option);
                    });
                    
                    // Zaman seçeneklerini doldur
                    timeSelect.innerHTML = '';
                    data.intervals.forEach((interval, index) => {
                        const option = document.createElement('option');
                        option.value = data.time_display[index]; // Zaman görüntüsünü kullan
                        option.textContent = data.time_display[index];
                        timeSelect.appendChild(option);
                    });
                    
                    // Dropdown'ları aktif et
                    dateSelect.disabled = false;
                    timeSelect.disabled = false;
                    
                    // Zaman görüntüleme eşlemesini oluştur
                    timeDisplayMap = {};
                    data.intervals.forEach((interval, index) => {
                        timeDisplayMap[interval] = data.time_display[index];
                    });
                    
                    // İlk seçenekleri yükle
                    if (data.weekdays.length > 0 && data.intervals.length > 0) {
                        updateMap();
                    }
                })
                .catch(error => {
                    console.error('Seçenekler yüklenirken hata:', error);
                    document.getElementById('loading').textContent = error.message;
                    document.getElementById('loading').style.display = 'inline';
                });
        }
        
        function updateMap() {
            const weekday = document.getElementById('dateSelect').value;
            const timeDisplay = document.getElementById('timeSelect').value;
            
            if (!weekday || !timeDisplay) return;
            
            document.getElementById('loading').style.display = 'inline';
            
            fetch(`/get_predicted_traffic?weekday=${weekday}&time=${timeDisplay}`)
                .then(response => {
                    if (!response.ok) throw new Error('Trafik verisi alınamadı');
                    return response.json();
                })
                .then(trafficData => {
                    // Dedektör verilerini güncelle
                    if (trafficData.detectors && trafficData.detectors.length > 0) {
                        mainLayer.eachLayer(layer => {
                            if (layer instanceof L.CircleMarker && layer._detId) {
                                const detData = trafficData.detectors.find(d => d.detid === layer._detId);
                                if (detData) {
                                    layer.setStyle({
                                        fillColor: detData.flow ? 'red' : 'blue'  // Akış varsa kırmızı, yoksa mavi
                                    });
                                    layer.bindPopup(`
                                        Dedektör: ${layer._detId}<br>
                                        Akış: ${detData.flow?.toFixed(1) || 'N/A'}<br>
                                        Doluluk: ${detData.occ?.toFixed(1) || 'N/A'}
                                    `);
                                }
                            }
                        });
                    } else {
                        console.error('Trafik verilerinde dedektör yok:', trafficData.detectors);
                    }

                    // Yol verilerini güncelle
                    mainLayer.eachLayer(layer => {
                        if (layer instanceof L.Polyline) {
                            const roadData = trafficData.roads?.find(r => r.id === layer._roadId);
                            if (roadData) {
                                layer.setStyle({
                                    color: getRoadColor(roadData.flow),
                                    weight: 3
                                });
                                layer.bindPopup(`
                                    Yol: ${roadData.id}<br>
                                    Akış: ${roadData.flow?.toFixed(1) || 'N/A'}<br>
                                    Doluluk: ${roadData.occ?.toFixed(1) || 'N/A'}
                                `);
                            }
                        }
                    });
                })
                .catch(console.error)
                .finally(() => {
                    document.getElementById('loading').style.display = 'none';
                });
        }
        
        function getRoadColor(flow) {
            if (!flow) return 'gray';
            if (flow < 100) return 'green';
            if (flow < 300) return 'yellow';
            if (flow < 800) return 'orange';
            return 'red';
        }
        
        // Örnek: 300 saniyeyi "00:05" formatına çevirme (client-side conversion - not used now as server sends time_display)
        // function formatInterval(seconds) {
        //     const hours = Math.floor(seconds / 3600);
        //     const mins = Math.floor((seconds % 3600) / 60);
        //     return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        // }
        
        // Sayfa yüklendiğinde haritayı başlat
        window.onload = initMap;
    </script>
</body>
</html>
